<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/splash-1080x1920.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Food-Q POS" />
    <meta name="description" content="Professional Food-Q restaurant POS and management system" />
    <title>Food-Q POS — Restaurant Management System</title>
    <style>
      /* Splash screen shown before React mounts */
      #splash {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 24px;
        animation: splash-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      #splash p {
        margin-top: 20px;
        color: #e23744;
        font-family: 'Outfit', sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 2px;
        animation: fade-in 0.6s ease 0.3s both;
      }
      #splash small {
        color: rgba(255,255,255,0.4);
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        margin-top: 6px;
        animation: fade-in 0.6s ease 0.5s both;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 40px;
        animation: fade-in 0.6s ease 0.6s both;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e23744;
        animation: dot-bounce 1.2s infinite ease-in-out;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes dot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1.2); opacity: 1; }
      }
      body { margin: 0; background: #0f172a; }
    </style>
  </head>
  <body>
    <!-- PWA Splash Screen -->
    <div id="splash">
      <img src="/pwa-192x192.png" alt="Food-Q Logo" />
      <p>FOOD-Q</p>
      <small>Restaurant POS & Management</small>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash screen once React has loaded
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(() => splash.remove(), 500);
          }
        }, 800);
      });
    </script>
  </body>
</html>
